openapi: 3.0.0
info:
  title: ATPP Relay Event
  version: 0.1.0
paths:
  /event/relay:
    post:
      summary: Ретрансляция события через peer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
                - propagation_state
                - signature
              properties:
                event_id:
                  type: string
                  description: Уникальный ID события
                propagation_state:
                  type: object
                  required:
                    - count
                    - witnesses
                  properties:
                    count:
                      type: integer
                    witnesses:
                      type: array
                      items:
                        type: string
                signature:
                  type: string
                  description: Подпись релеятора
      responses:
        '200':
          description: Propagation state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  propagation_state:
                    type: object
                    required:
                      - count
                      - witnesses
                    properties:
                      count:
                        type: integer
                      witnesses:
                        type: array
                        items:
                          type: string
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          description: Validation error
        '429':
          description: Rate limit exceeded


