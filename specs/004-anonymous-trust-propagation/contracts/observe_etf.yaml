openapi: 3.0.0
info:
  title: ATPP Observe ETF
  version: 0.1.0
paths:
  /event/etf:
    get:
      summary: Получить ETF для события
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          description: ID события
      responses:
        '200':
          description: ETF for event
          content:
            application/json:
              schema:
                type: object
                properties:
                  etf:
                    type: number
                    format: float
                    description: Текущий Emergent Trust Factor
                  propagation_state:
                    type: object
                    required:
                      - count
                      - witnesses
                    properties:
                      count:
                        type: integer
                      witnesses:
                        type: array
                        items:
                          type: string
                  ttl:
                    type: integer
                  status:
                    type: string
                    enum: [active, expired]
                  errors:
                    type: array
                    items:
                      type: string
        '404':
          description: Event not found


