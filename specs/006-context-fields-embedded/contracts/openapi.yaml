openapi: 3.0.3
info:
  title: Truth Training API - Context Fields Embedded
  version: 1.0.0
  description: API for events with embedded context fields and context template management

paths:
  /events:
    post:
      summary: Create a new event with embedded context fields
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '200':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Validation error (invalid FK reference or empty description)
        '500':
          description: Internal server error

  /contexts:
    get:
      summary: List all context templates
      operationId: listContexts
      responses:
        '200':
          description: List of context templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextTemplate'
                  total:
                    type: integer

    post:
      summary: Create a new context template
      operationId: createContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContextRequest'
      responses:
        '200':
          description: Context template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTemplate'
        '400':
          description: Validation error (duplicate template, invalid FK, empty name)
        '409':
          description: Conflict - template with identical fields already exists
        '500':
          description: Internal server error

  /contexts/by-name/{name}:
    get:
      summary: Get context template by name
      operationId: getContextByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Context template found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTemplate'
        '404':
          description: Template not found
        '500':
          description: Internal server error

  /contexts/match:
    post:
      summary: Match event fields to a context template
      operationId: matchContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchContextRequest'
      responses:
        '200':
          description: Match result
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched:
                    type: boolean
                  template:
                    $ref: '#/components/schemas/ContextTemplate'
                    nullable: true
        '500':
          description: Internal server error

  /contexts/from-event:
    post:
      summary: Create context template from event fields
      operationId: createContextFromEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContextFromEventRequest'
      responses:
        '200':
          description: Context template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTemplate'
        '400':
          description: Validation error (duplicate template, invalid FK, empty name)
        '409':
          description: Conflict - template with identical fields already exists
        '500':
          description: Internal server error

components:
  schemas:
    CreateEventRequest:
      type: object
      required:
        - description
        - vector
      properties:
        description:
          type: string
          minLength: 1
        category_id:
          type: integer
          nullable: true
        forma_id:
          type: integer
          nullable: true
        cause_id:
          type: integer
          nullable: true
        develop_id:
          type: integer
          nullable: true
        effect_id:
          type: integer
          nullable: true
        vector:
          type: boolean

    EventResponse:
      type: object
      properties:
        id:
          type: integer

    ContextTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category_id:
          type: integer
          nullable: true
        forma_id:
          type: integer
          nullable: true
        cause_id:
          type: integer
          nullable: true
        develop_id:
          type: integer
          nullable: true
        effect_id:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true

    CreateContextRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        category_id:
          type: integer
          nullable: true
        forma_id:
          type: integer
          nullable: true
        cause_id:
          type: integer
          nullable: true
        develop_id:
          type: integer
          nullable: true
        effect_id:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true

    MatchContextRequest:
      type: object
      properties:
        category_id:
          type: integer
          nullable: true
        forma_id:
          type: integer
          nullable: true
        cause_id:
          type: integer
          nullable: true
        develop_id:
          type: integer
          nullable: true
        effect_id:
          type: integer
          nullable: true

    CreateContextFromEventRequest:
      type: object
      required:
        - name
        - event_id
      properties:
        name:
          type: string
          minLength: 1
        event_id:
          type: integer
        description:
          type: string
          nullable: true

