[package]
name = "truth-ui-desktop"
version = "1.0.0"
description = "Truth Training Desktop UI"
authors = ["ekwator"]
license = "MIT"
repository = "https://github.com/ekwator/truth-training"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
glib = "0.20.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
directories = "5"
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json"] }
dirs = "5"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "sync", "time"] }
log = "0.4"
core_lib = { path = "../../../core", version = "1.0.0" }
truth_core = { path = "../../..", version = "1.0.0", features = ["desktop"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
