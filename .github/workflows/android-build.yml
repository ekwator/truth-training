name: Android Build & Test

on:
  push:
    branches: ['**']
    tags:
      - '**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  
permissions:
  actions: read
  contents: write


jobs:
  test:
    runs-on: macos-15-intel
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) && !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    env:
      ART_DIR: ${{ github.workspace }}/android-test-artifacts
      DISABLE_LOCAL_TESTS: 'false'
      DISABLE_MOCK_TESTS: 'false'
      DISABLE_REMOTE_TESTS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Install Rust (for test JNI build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Set up Android NDK (for Rust cross-compile)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;26.1.10909125

      - name: Export NDK toolchain (macOS)
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/darwin-x86_64/bin" >> $GITHUB_PATH

      - name: Install coreutils (gtimeout) for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update || true
          brew install coreutils || true

      - name: Enable Gradle caching and parallel builds
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.daemon=true"
          } >> ~/.gradle/gradle.properties

      - name: Build and copy JNI libraries for tests
        run: |
          echo "Building Rust libraries for Android (x86_64 + arm64-v8a)"
          cargo build --release --target x86_64-linux-android --features mobile --lib -p truth_core
          cargo build --release --target aarch64-linux-android --features mobile --lib -p truth_core
          mkdir -p truth-android-client/app/src/main/jniLibs/x86_64
          mkdir -p truth-android-client/app/src/main/jniLibs/arm64-v8a
          # Rename libtruth_core.so -> libtruthcore.so to match System.loadLibrary("truthcore")
          cp target/x86_64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/x86_64/libtruthcore.so
          cp target/aarch64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/arm64-v8a/libtruthcore.so
 
      - name: Prepare emulator test script
        shell: bash
        run: |
          set -euo pipefail

          # Path to generated script inside workspace
          SCRIPT_PATH="${GITHUB_WORKSPACE}/run_tests.sh"
          ART_DIR="${ART_DIR:-${GITHUB_WORKSPACE}/android-test-artifacts}"
          BOOT_TIMEOUT="${BOOT_TIMEOUT:-300}"
          GRADLE_TIMEOUT_MIN="${GRADLE_TIMEOUT_MIN:-150}"

          # Export ART_DIR so it's available in the script
          export ART_DIR

          cat > "${SCRIPT_PATH}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          # timeout on macOS via coreutils (gtimeout)
          if ! command -v timeout >/dev/null 2>&1 && command -v gtimeout >/dev/null 2>&1; then
            alias timeout='gtimeout'
          fi

          # Determine ART_DIR - use environment variable if set, otherwise use the value from workflow or fallback
          ART_DIR="\${ART_DIR:-${ART_DIR}}"
          if [ -z "\${ART_DIR}" ]; then
            if [ -n "\${GITHUB_WORKSPACE:-}" ]; then
              ART_DIR="\${GITHUB_WORKSPACE}/android-test-artifacts"
            else
              ART_DIR="\$(pwd)/android-test-artifacts"
            fi
          fi
          export ART_DIR
          BOOT_TIMEOUT="\${BOOT_TIMEOUT:-${BOOT_TIMEOUT}}"
          GRADLE_TIMEOUT_MIN="\${GRADLE_TIMEOUT_MIN:-${GRADLE_TIMEOUT_MIN}}"
          
          echo "📁 ART_DIR is set to: \${ART_DIR}"
          echo "📁 GITHUB_WORKSPACE: \${GITHUB_WORKSPACE:-not set}"
          echo "📁 Current directory: \$(pwd)"

          echo "⏳ Waiting for Android system to finish booting (timeout: \${BOOT_TIMEOUT}s)..."
          for i in \$(seq 1 "\${BOOT_TIMEOUT}"); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              echo "✅ Device reported sys.boot_completed after \${i}s"
              break
            fi
            sleep 1
          done

          # Unlock device (in case lock screen blocks instrumentation)
          adb shell input keyevent 82 || true
          sleep 2

          echo "📱 Running connected tests sequentially..."

          # Create ART_DIR at the start to ensure it exists
          mkdir -p "\${ART_DIR}/reports" "\${ART_DIR}/outputs" "\${ART_DIR}/logs" || true

          # Dynamically disable any flavor based on environment variables
          for flavor in local mock remote; do
            upper_flavor=\$(printf '%s' "\$flavor" | tr '[:lower:]' '[:upper:]')
            var_name="DISABLE_\${upper_flavor}_TESTS"
            # Use indirect variable expansion with default value
            # This expands to: eval "val=\${DISABLE_LOCAL_TESTS:-false}" etc.
            # Use set +u temporarily to avoid errors with unset variables
            set +u
            eval "val=\\\$\${var_name}:-false"
            set -u
            if [ "\${val}" = "true" ]; then
              echo "⏩ Skipping \${flavor} tests (disabled via \${var_name})"
              continue
            fi

            echo "🚀 Starting tests for flavor: \${flavor}"
            # Map to Gradle task case
            case "\${flavor}" in
              local) FLV=Local ;;
              mock) FLV=Mock ;;
              remote) FLV=Remote ;;
              *) FLV=Local ;;
            esac
            # Generate log filename based on flavor
            LOG_FILE="gradle-build-\${flavor}.log"
            # Run Gradle tests and redirect all output to flavor-specific log file
            if ! timeout "\${GRADLE_TIMEOUT_MIN}m" bash -lc "
              cd truth-android-client && \
              ./gradlew connected\${FLV}DebugAndroidTest --build-cache \
              --continue --stacktrace --info -Pkotlin.warningsAsErrors=true \
              > ../\${LOG_FILE} 2>&1
           "; then
              echo "⚠️ Tests for \${flavor} failed or timed out." | tee -a ../\${LOG_FILE}
            fi

            # Copy flavor-specific log to ART_DIR
            if [ -f "../\${LOG_FILE}" ]; then
              cp -f "../\${LOG_FILE}" "\${ART_DIR}/logs/\${LOG_FILE}" || true
            fi

            # Collect per-flavor reports (best-effort)
            mkdir -p "\${ART_DIR}/reports/\$flavor" || true
            mkdir -p "\${ART_DIR}/outputs/\$flavor" || true
            cp -R truth-android-client/app/build/reports/androidTests/connected "\${ART_DIR}/reports/\$flavor/" 2>/dev/null || true
            cp -R truth-android-client/app/build/outputs/androidTest-results "\${ART_DIR}/outputs/\$flavor/" 2>/dev/null || true
            # Clear build outputs to avoid report overwrites in next flavor
            rm -rf truth-android-client/app/build/reports/androidTests/connected || true
            rm -rf truth-android-client/app/build/outputs/androidTest-results || true
          done

          echo "🚀 Running performance tests (timeout \${GRADLE_TIMEOUT_MIN}m)..."
          PERF_LOG_FILE="gradle-build-perf.log"
          if ! timeout "\${GRADLE_TIMEOUT_MIN}m" bash -lc "
            cd truth-android-client && \
            ./gradlew connectedAndroidTest --build-cache \
            -Pandroid.testInstrumentationRunnerArguments=package=com.truth.training.client.performance \
            --continue --stacktrace --info -Pkotlin.warningsAsErrors=true \
            > ../\${PERF_LOG_FILE} 2>&1
          "; then
            echo "⚠️ Performance tests failed or timed out." | tee -a ../\${PERF_LOG_FILE}
          fi

          # Copy performance log to ART_DIR
          if [ -f "../\${PERF_LOG_FILE}" ]; then
            cp -f "../\${PERF_LOG_FILE}" "\${ART_DIR}/logs/\${PERF_LOG_FILE}" || true
          fi

          echo "📦 Collecting Gradle logs and logcat..."
          adb logcat -d > "\${ART_DIR}/logs/logcat.txt" 2>/dev/null || echo "⚠️ logcat dump failed"
          du -h "\${ART_DIR}/logs/logcat.txt" || true
          
          # Final summary of collected artifacts
          echo ""
          echo "📁 ART_DIR: \${ART_DIR}"
          if [ -d "\${ART_DIR}" ]; then
            echo "✅ Artifacts directory exists"
          else
            echo "❌ Artifacts directory does not exist: \${ART_DIR}"
          fi
          EOF

          chmod +x "${SCRIPT_PATH}"
          echo "✅ Generated run_tests.sh at ${SCRIPT_PATH}"

      - name: Run integration and performance tests on emulator (macOS HVF)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1800000
          emulator-options: -no-snapshot -no-snapshot-load -no-boot-anim -no-window -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none
          script: ./run_tests.sh

 
      - name: Stop Android Emulator
        if: always()
        run: |
          adb devices || true
          adb emu kill || true
          pkill -f emulator || true
      
      - name: Verify collected reports
        if: always()
        run: |
          echo "✅ Listing collected test reports..."
          ART_DIR="${{ env.ART_DIR }}"
          if [ -d "$ART_DIR" ]; then
            echo "📁 Artifacts directory exists: $ART_DIR"
          else
            echo "⚠️ Artifacts directory not found: $ART_DIR"
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.ART_DIR }}/**/*
          retention-days: 7
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    strategy:
      matrix:
        buildType: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      
      - name: Set up Android SDK and NDK
        if: ${{ github.event_name != 'workflow_run' || steps.check-artifacts.outputs.artifacts-found != 'true' }}
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;26.1.10909125
      
      - name: Export NDK toolchain
        if: ${{ github.event_name != 'workflow_run' || steps.check-artifacts.outputs.artifacts-found != 'true' }}
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      
      - name: Download Android Rust libraries from Cross-Platform run
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: libtruth_core-android
          path: target/
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Check if artifacts were downloaded
        id: check-artifacts
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          if [ -f "target/aarch64-linux-android/release/libtruth_core.so" ] && [ -f "target/x86_64-linux-android/release/libtruth_core.so" ]; then
            echo "artifacts-found=true" >> $GITHUB_OUTPUT
            echo "✓ Both Android Rust artifacts present (arm64 + x86_64)"
          else
            echo "artifacts-found=false" >> $GITHUB_OUTPUT
            echo "⚠ Missing one or both Android Rust artifacts; will build locally"
          fi
      
      - name: Build Android Rust libraries
        if: ${{ github.event_name != 'workflow_run' || steps.check-artifacts.outputs.artifacts-found != 'true' }}
        run: |
          echo "Building Rust libraries locally..."
          cargo build --release --target aarch64-linux-android --features mobile --lib -p truth_core
          cargo build --release --target x86_64-linux-android --features mobile --lib -p truth_core
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            truth-android-client/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('truth-android-client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Copy Rust libraries to Android project
        run: |
          mkdir -p truth-android-client/app/src/main/jniLibs/arm64-v8a/
          mkdir -p truth-android-client/app/src/main/jniLibs/x86_64/
          cp target/aarch64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/x86_64/
      
      - name: Build APK (Debug)
        if: ${{ matrix.buildType == 'debug' && !startsWith(github.ref, 'refs/tags/') }}
        working-directory: truth-android-client
        run: |
          # Build each flavor separately to isolate issues
          ./gradlew assembleLocalDebug --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "LocalDebug build failed, continuing..."
          ./gradlew assembleMockDebug --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "MockDebug build failed, continuing..."
          ./gradlew assembleRemoteDebug --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "RemoteDebug build failed, continuing..."
          ./gradlew assembleLocalDebugAndroidTest --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "LocalDebugAndroidTest build failed, continuing..."
          ./gradlew assembleMockDebugAndroidTest --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "MockDebugAndroidTest build failed, continuing..."
          ./gradlew assembleRemoteDebugAndroidTest --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "RemoteDebugAndroidTest build failed, continuing..."
      
      - name: Build AAB (Release)
        if: matrix.buildType == 'release'
        working-directory: truth-android-client
        run: |
          # Build each flavor separately to isolate issues
          ./gradlew bundleLocalRelease --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "LocalRelease build failed, continuing..."
          ./gradlew bundleMockRelease --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "MockRelease build failed, continuing..."
          ./gradlew bundleRemoteRelease --build-cache --stacktrace -Pkotlin.warningsAsErrors=true || echo "RemoteRelease build failed, continuing..."
      
      - name: Upload APK artifacts
        if: ${{ matrix.buildType == 'debug' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            truth-android-client/app/build/outputs/apk/**/*.apk
          retention-days: 30
      
      - name: Upload AAB artifacts
        if: matrix.buildType == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: |
            truth-android-client/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'android-*'
          merge-multiple: true
          path: artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}