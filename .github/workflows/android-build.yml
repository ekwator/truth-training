name: Android Build & Test

on:
  push:
    branches: [ master ]
    tags:
      - '**'
  pull_request:
    branches: [ master ]
  workflow_run:
    workflows: ["Cross-Platform Build"]
    types: [completed]
    branches: [master]
    tags:
      - '**'
  workflow_dispatch:
  
permissions:
  actions: read
  contents: write
  

jobs:
  test:
    runs-on: macos-15-intel
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) && !startsWith(github.ref, 'refs/tags/') }}
    env:
      ART_DIR: ${{ github.workspace }}/android-test-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Install Rust (for test JNI build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Set up Android NDK (for Rust cross-compile)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;26.1.10909125

      - name: Export NDK toolchain (macOS)
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/darwin-x86_64/bin" >> $GITHUB_PATH

      - name: Build and copy JNI libraries for tests
        run: |
          echo "Building Rust libraries for Android (x86_64 + arm64-v8a)"
          cargo build --release --target x86_64-linux-android --features mobile --lib -p truth_core
          cargo build --release --target aarch64-linux-android --features mobile --lib -p truth_core
          mkdir -p truth-android-client/app/src/main/jniLibs/x86_64
          mkdir -p truth-android-client/app/src/main/jniLibs/arm64-v8a
          # Rename libtruth_core.so -> libtruthcore.so to match System.loadLibrary("truthcore")
          cp target/x86_64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/x86_64/libtruthcore.so
          cp target/aarch64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/arm64-v8a/libtruthcore.so
 
      - name: Prepare emulator test script
        shell: bash
        run: |
          set -euo pipefail

          # Path to generated script inside workspace
          SCRIPT_PATH="${GITHUB_WORKSPACE}/run_tests.sh"
          ART_DIR="${ART_DIR:-${GITHUB_WORKSPACE}/android-test-artifacts}"
          BOOT_TIMEOUT="${BOOT_TIMEOUT:-300}"
          GRADLE_TIMEOUT_MIN=30

          cat > "${SCRIPT_PATH}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export ART_DIR="${ART_DIR}"
          export GITHUB_WORKSPACE="${GITHUB_WORKSPACE}"
          boot_timeout="${BOOT_TIMEOUT:-300}"
          gradle_timeout_min=${GRADLE_TIMEOUT_MIN:-30}
          cd "${GITHUB_WORKSPACE}"

          # Start adb server and wait for device visibility
          adb start-server || true
          adb wait-for-device

          echo "⏳ Waiting for Android system to finish booting (timeout: ${boot_timeout}s)..."
          if command -v seq >/dev/null 2>&1; then
            for i in $(seq 1 "${boot_timeout}"); do
              if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
                echo "✅ Device reported sys.boot_completed after ${i}s"
                break
              fi
              if [ "${i}" -eq "${boot_timeout}" ]; then
                echo "❌ Timed out waiting for Android to finish booting (${boot_timeout}s)"
                adb devices -l || true
                # Do not exit here; let gradle run so logs can be collected
                break
              fi
              sleep 1
            done
          else
            # fallback simple loop
            i=1
            while [ "${i}" -le "${boot_timeout}" ]; do
              if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
                echo "✅ Device reported sys.boot_completed after ${i}s"
                break
              fi
              if [ "${i}" -eq "${boot_timeout}" ]; then
                echo "❌ Timed out waiting for Android to finish booting (${boot_timeout}s)"
                adb devices -l || true
                break
              fi
              sleep 1
              i=$((i+1))
            done
          fi

          # Unlock device so instrumentation isn't blocked by lock screen
          adb shell input keyevent 82 || true
          sleep 3

          # Run integration tests (puts output into ../gradle-build.log as before)
          echo "🚀 Running integration tests (timeout ${gradle_timeout_min}m)..."
          if ! timeout "${gradle_timeout_min}m" bash -c "cd truth-android-client && ./gradlew connectedLocalDebugAndroidTest connectedMockDebugAndroidTest connectedRemoteDebugAndroidTest --continue --stacktrace --info -Pkotlin.warningsAsErrors=true > ../gradle-build.log 2>&1"; then
            echo "⚠️ Integration tests failed or timed out (check ../gradle-build.log)"
          fi

          # Run performance tests (separate timeout)
          echo "🚀 Running performance tests (timeout ${gradle_timeout_min}m)..."
          adb wait-for-device || true
          if ! timeout "${gradle_timeout_min}m" bash -c "cd truth-android-client && ./gradlew connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments=package=com.truth.training.client.performance --continue --stacktrace --info -Pkotlin.warningsAsErrors=true >> ../gradle-build.log 2>&1"; then
            echo "⚠️ Performance tests failed or timed out (check ../gradle-build.log)"
          fi

          # Collect test reports and logs into ART_DIR
          mkdir -p "${ART_DIR}/outputs" "${ART_DIR}/reports" "${ART_DIR}/logs" || true
          cp -R "${GITHUB_WORKSPACE}/truth-android-client/app/build/outputs/androidTest-results" "${ART_DIR}/outputs/" 2>/dev/null || true
          cp -R "${GITHUB_WORKSPACE}/truth-android-client/app/build/reports/androidTests" "${ART_DIR}/reports/" 2>/dev/null || true
          cp -R "${GITHUB_WORKSPACE}/truth-android-client/app/build/test-results" "${ART_DIR}/" 2>/dev/null || true

          # Copy gradle build log if present
          if [ -f "${GITHUB_WORKSPACE}/gradle-build.log" ]; then
            cp "${GITHUB_WORKSPACE}/gradle-build.log" "${ART_DIR}/logs/gradle-build.log" || true
          fi

          # Dump logcat if device is present
          echo "🪵 Dumping logcat to ${ART_DIR}/logs/logcat.txt"
          echo "=== LOGCAT DUMP ($(date)) ===" > "${ART_DIR}/logs/logcat.txt" || true
          if adb get-state 1>/dev/null 2>&1; then
            adb logcat -d >> "${ART_DIR}/logs/logcat.txt" 2>/dev/null || echo "⚠️ logcat failed" || true
          else
            echo "⚠️ No emulator/device detected — skipping logcat dump" >> "${ART_DIR}/logs/logcat.txt"
          fi

          # Small summary
          FOUND_FILES=$(find "${ART_DIR}" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "${FOUND_FILES:-0}" -eq 0 ]; then
            echo "⚠️ No reports collected; creating placeholder"
            echo "no reports found" > "${ART_DIR}/no-reports.txt" || true
          else
            echo "✅ Collected ${FOUND_FILES} files under ${ART_DIR}"
          fi

          EOF

          chmod +x "${SCRIPT_PATH}"
          echo "✅ Generated run_tests.sh at ${SCRIPT_PATH}"

      - name: Run integration and performance tests on emulator (macOS HVF)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1800000
          emulator-options: -no-snapshot -no-snapshot-load -no-boot-anim -no-window -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none
          script: |
            echo "🚀 Running integration tests on Android emulator..."
            # Ensure adb server is started and the emulator is visible
            adb start-server
            adb wait-for-device

            # Wait for Android system to be fully booted (sys.boot_completed == 1).
            # Timeout after 300s (5 minutes) to fail fast if emulator never completes boot.
            boot_timeout=300
            i=1
            while [ "$i" -le "$boot_timeout" ]; do
              if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
                echo "Device fully booted"
                break
              fi
              if [ "$i" -eq "$boot_timeout" ]; then
                echo "Timed out waiting for Android to finish booting"
                adb devices -l || true
                exit 1
              fi
              echo "Waiting for Android boot... ($i/$boot_timeout)"
              i=$((i+1))
              sleep 1
            done
            adb devices -l
            # Unlock device in case the lock screen would block instrumentation
            adb shell input keyevent 82 || true
            sleep 5

            # Run integration tests with a hard timeout so the job can't hang indefinitely.
            # Increase the timeout (30m) if you expect longer test runs.
            timeout 30m bash -c "cd truth-android-client && ./gradlew connectedLocalDebugAndroidTest connectedMockDebugAndroidTest connectedRemoteDebugAndroidTest --continue --stacktrace --info -Pkotlin.warningsAsErrors=true > ../gradle-build.log 2>&1" || echo "Some integration tests failed or timed out"

            echo "🚀 Running performance tests on Android emulator..."
            # Ensure device still attached before running performance tests
            adb wait-for-device
            timeout 30m bash -c "cd truth-android-client && ./gradlew connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments=package=com.truth.training.client.performance --continue --stacktrace --info -Pkotlin.warningsAsErrors=true >> ../gradle-build.log 2>&1" || echo "Performance tests completed with warnings or timed out"

            echo "📦 Collecting test reports..."
            mkdir -p "${ART_DIR}/outputs" || true
            mkdir -p "${ART_DIR}/reports" || true
            # Ensure directory has proper permissions
            chmod -R 755 "${ART_DIR}" || true
            # Copy results if they exist
            cp -R "${GITHUB_WORKSPACE}/truth-android-client/app/build/outputs/androidTest-results" "${ART_DIR}/outputs/" 2>/dev/null || true
            cp -R "${GITHUB_WORKSPACE}/truth-android-client/app/build/reports/androidTests" "${ART_DIR}/reports/" 2>/dev/null || true
            # Also copy unit test results if present
            cp -R "${GITHUB_WORKSPACE}/truth-android-client/app/build/test-results" "${ART_DIR}/" 2>/dev/null || true

            # Ensure artifact directory is non-empty
            if ! find "${ART_DIR}" -type f | grep -q .; then echo "⚠️ No reports found — creating placeholder"; echo "no reports found" > "${ART_DIR}/no-reports.txt"; fi

            echo "📦 Collecting Gradle build logs..."
            mkdir -p "${ART_DIR}/logs" || true
            cp "${GITHUB_WORKSPACE}/gradle-build.log" "${ART_DIR}/logs/gradle-build.log" 2>/dev/null || echo "⚠️ No Gradle log found"

            echo "🪵 Capturing Android logcat output..."
            mkdir -p "${ART_DIR}/logs" || true
            echo "=== LOGCAT DUMP ($(date)) ===" > "${ART_DIR}/logs/logcat.txt"

            if adb get-state 1>/dev/null 2>&1; then echo "Device is active — dumping logs..."; adb logcat -d >> "${ART_DIR}/logs/logcat.txt" 2>/dev/null || echo "⚠️ logcat failed"; sleep 2; else echo "⚠️ No emulator/device detected — skipping logcat dump" >> "${ART_DIR}/logs/logcat.txt"; fi

            du -h "${ART_DIR}/logs/logcat.txt" || true
 
      - name: Stop Android Emulator
        if: always()
        run: |
          adb devices || true
          adb emu kill || true
          pkill -f emulator || true
      
      - name: Verify collected reports
        if: always()
        run: |
          echo "✅ Listing collected test reports..."
          find "${{ env.ART_DIR }}" -type f | head -20 || echo "⚠️ No files found"
          echo "Total files: $(find "${{ env.ART_DIR }}" -type f 2>/dev/null | wc -l || echo 0)"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.ART_DIR }}/**/*.*
          retention-days: 7
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    strategy:
      matrix:
        buildType: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      
      - name: Set up Android SDK and NDK
        if: ${{ github.event_name != 'workflow_run' || steps.check-artifacts.outputs.artifacts-found != 'true' }}
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;26.1.10909125
      
      - name: Export NDK toolchain
        if: ${{ github.event_name != 'workflow_run' || steps.check-artifacts.outputs.artifacts-found != 'true' }}
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      
      - name: Download Android Rust libraries from Cross-Platform run
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: libtruth_core-android
          path: target/
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Check if artifacts were downloaded
        id: check-artifacts
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          if [ -f "target/aarch64-linux-android/release/libtruth_core.so" ] && [ -f "target/x86_64-linux-android/release/libtruth_core.so" ]; then
            echo "artifacts-found=true" >> $GITHUB_OUTPUT
            echo "✓ Both Android Rust artifacts present (arm64 + x86_64)"
          else
            echo "artifacts-found=false" >> $GITHUB_OUTPUT
            echo "⚠ Missing one or both Android Rust artifacts; will build locally"
          fi
      
      - name: Build Android Rust libraries
        if: ${{ github.event_name != 'workflow_run' || steps.check-artifacts.outputs.artifacts-found != 'true' }}
        run: |
          echo "Building Rust libraries locally..."
          cargo build --release --target aarch64-linux-android --features mobile --lib -p truth_core
          cargo build --release --target x86_64-linux-android --features mobile --lib -p truth_core
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            truth-android-client/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('truth-android-client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Copy Rust libraries to Android project
        run: |
          mkdir -p truth-android-client/app/src/main/jniLibs/arm64-v8a/
          mkdir -p truth-android-client/app/src/main/jniLibs/x86_64/
          cp target/aarch64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libtruth_core.so truth-android-client/app/src/main/jniLibs/x86_64/
      
      - name: Build APK (Debug)
        if: ${{ matrix.buildType == 'debug' && !startsWith(github.ref, 'refs/tags/') }}
        working-directory: truth-android-client
        run: |
          # Build each flavor separately to isolate issues
          ./gradlew assembleLocalDebug --stacktrace -Pkotlin.warningsAsErrors=true || echo "LocalDebug build failed, continuing..."
          ./gradlew assembleMockDebug --stacktrace -Pkotlin.warningsAsErrors=true || echo "MockDebug build failed, continuing..."
          ./gradlew assembleRemoteDebug --stacktrace -Pkotlin.warningsAsErrors=true || echo "RemoteDebug build failed, continuing..."
          ./gradlew assembleLocalDebugAndroidTest --stacktrace -Pkotlin.warningsAsErrors=true || echo "LocalDebugAndroidTest build failed, continuing..."
          ./gradlew assembleMockDebugAndroidTest --stacktrace -Pkotlin.warningsAsErrors=true || echo "MockDebugAndroidTest build failed, continuing..."
          ./gradlew assembleRemoteDebugAndroidTest --stacktrace -Pkotlin.warningsAsErrors=true || echo "RemoteDebugAndroidTest build failed, continuing..."
      
      - name: Build AAB (Release)
        if: matrix.buildType == 'release'
        working-directory: truth-android-client
        run: |
          # Build each flavor separately to isolate issues
          ./gradlew bundleLocalRelease --stacktrace -Pkotlin.warningsAsErrors=true || echo "LocalRelease build failed, continuing..."
          ./gradlew bundleMockRelease --stacktrace -Pkotlin.warningsAsErrors=true || echo "MockRelease build failed, continuing..."
          ./gradlew bundleRemoteRelease --stacktrace -Pkotlin.warningsAsErrors=true || echo "RemoteRelease build failed, continuing..."
      
      - name: Upload APK artifacts
        if: ${{ matrix.buildType == 'debug' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            truth-android-client/app/build/outputs/apk/**/*.apk
          retention-days: 30
      
      - name: Upload AAB artifacts
        if: matrix.buildType == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: |
            truth-android-client/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'android-*'
          merge-multiple: true
          path: artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}