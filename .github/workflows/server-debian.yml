name: Build Debian Truth Core Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/debian/**'
      - '.github/workflows/server-debian.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build truth_core_server binary
        run: cargo build --release --bin truth_core_server
      - name: Prepare packaging deps
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build .deb package
        run: make -C packaging/debian deb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_service_deb
          path: packaging/truth-core-service.deb
