name: Build Debian Truth Core Service

on:
  push:
    # paths:
    #   - 'packaging/debian/**'
    #   - '.github/workflows/server-debian.yml'
    #   - 'src/**'
    #   - 'Cargo.toml'
    #   - 'Cargo.lock'
    # branches: [ main ]
    # tags:
    #   - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build truth_core_server binary
        run: cargo build --release --bin truth_core_server
      - name: Prepare packaging deps
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build .deb package
        run: make -C packaging/debian deb
      - name: Upload artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_server_deb
          path: packaging/truth-core-server.deb
          retention-days: 7

  publish-release:
    needs: [linux-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: false
          path: artifacts
      - name: Publish Release (attach artifacts only)
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/truth_core_server_deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
