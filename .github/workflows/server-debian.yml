name: Build Debian Truth Core Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/debian/**'
      - '.github/workflows/server-debian.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
    branches: [ master ]
    tags:
      - '**'

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build truth_core_server binary
        run: cargo build --release --bin truth_core_server
      - name: Prepare packaging deps
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build .deb package
        run: make -C packaging/debian deb
      - name: Upload artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_service_deb
          path: packaging/truth-core-service.deb
          retention-days: 7
      - name: Publish Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          name: Debian truth_core service (${{ github.ref_name }})
          files: |
            packaging/truth-core-service.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Release (draft on branch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: debian-truth-core-${{ github.sha }}
          name: Debian truth_core service (${{ github.sha }})
          files: |
            packaging/truth-core-service.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
