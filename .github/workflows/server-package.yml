name: Server Package

on:
  # push:
  #   branches: [ master ]
  #   tags:
  #     - '**'
  # pull_request:
  #   branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging deps (fpm, rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Build server (release)
        run: cargo build --release --bin truth_core_server --features desktop
      - name: Rename binary and prepare packaging
        run: |
          mkdir -p packaging-temp/usr/bin
          mkdir -p packaging-temp/usr/lib/truth-core-server
          # Rename binary from truth_core_server to truth-core-server
          cp target/release/truth_core_server packaging-temp/usr/bin/truth-core-server
          chmod 755 packaging-temp/usr/bin/truth-core-server
          # Prepare systemd user service file
          cat > packaging-temp/usr/lib/truth-core-server/truth-core-server.service <<'EOF'
          [Unit]
          Description=Truth Core Server
          After=network.target

          [Service]
          ExecStart=/usr/bin/truth-core-server
          Restart=always
          Environment=RUST_LOG=info

          [Install]
          WantedBy=default.target
          EOF
      - name: Build DEB
        run: |
          fpm -s dir -t deb -n truth-core-server -v 1.0.0 \
              --prefix / packaging-temp/usr/bin/truth-core-server=/usr/bin/truth-core-server \
              packaging-temp/usr/lib/truth-core-server/truth-core-server.service=/usr/lib/truth-core-server/truth-core-server.service
      - name: Build RPM
        run: |
          fpm -s dir -t rpm -n truth-core-server -v 1.0.0 \
              --prefix / packaging-temp/usr/bin/truth-core-server=/usr/bin/truth-core-server \
              packaging-temp/usr/lib/truth-core-server/truth-core-server.service=/usr/lib/truth-core-server/truth-core-server.service
      - name: Verify binary
        run: ./packaging-temp/usr/bin/truth-core-server --version || true
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: truth-core-server-linux
          path: |
            *.deb
            *.rpm
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build server (release)
        run: cargo build --release --bin truth_core_server --features desktop
      - name: Download WinSW
        shell: pwsh
        run: |
          $url = "https://github.com/winsw/winsw/releases/download/v3.0.3/WinSW-x64.exe"
          curl.exe -L -o winsw.exe $url
      - name: Prepare service files
        shell: pwsh
        run: |
          Set-Content -Path truth_core_server.xml -Value @'
          <service>
            <id>TruthCoreServer</id>
            <name>Truth Core Server</name>
            <description>Runs Truth Training backend service.</description>
            <executable>%BASE%\truth_core_server.exe</executable>
            <logpath>%BASE%\logs</logpath>
            <log mode="roll"></log>
          </service>
          '@
      - name: Create NSIS installer
        shell: pwsh
        run: |
          $nsisScript = @'
          !include "MUI2.nsh"
          Name "Truth Core Server"
          OutFile "truth-core-server-windows.exe"
          InstallDir "$PROGRAMFILES\\TruthCoreServer"
          Page directory
          Page instfiles
          Section "Install"
            SetOutPath "$INSTDIR"
            File "target\\release\\truth_core_server.exe"
            File "winsw.exe"
            File "truth_core_server.xml"
            Rename "$INSTDIR\\winsw.exe" "$INSTDIR\\TruthCoreServer.exe"
            nsExec::ExecToStack '"$INSTDIR\\TruthCoreServer.exe" install'
            nsExec::ExecToStack '"$INSTDIR\\TruthCoreServer.exe" start'
          SectionEnd
          '@
          Set-Content -Path installer.nsi -Value $nsisScript
          
          # Locate makensis.exe reliably
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            Write-Host "makensis.exe not found, listing NSIS dir for debug..."
            Get-ChildItem "C:\Program Files (x86)\NSIS" -Recurse | Select-Object FullName
            throw "makensis.exe not found"
          }

          & "$makensis" "installer.nsi"
      - name: Verify binary
        shell: pwsh
        continue-on-error: true
        run: |
          & .\target\release\truth-core-server.exe --help
          Write-Host "Verification invoked"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: truth-core-server-windows
          path: truth-core-server-windows.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build server (release)
        run: cargo build --release --bin truth_core_server --features desktop
      - name: Rename binary and prepare LaunchAgent plist
        run: |
          # Rename binary from truth_core_server to truth-core-server
          mkdir -p payload/usr/local/bin
          cp target/release/truth_core_server payload/usr/local/bin/truth-core-server
          chmod 755 payload/usr/local/bin/truth-core-server
          
          # Prepare LaunchAgent plist (user service, not LaunchDaemon)
          mkdir -p payload/usr/lib/truth-core-server
          cat > payload/usr/lib/truth-core-server/com.truth.training.server.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>com.truth.training.server</string>
            <key>ProgramArguments</key>
            <array>
              <string>/usr/local/bin/truth-core-server</string>
            </array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
          </dict>
          </plist>
          EOF
      - name: Build PKG
        run: |
          pkgbuild --root ./payload \
                   --install-location / \
                   --identifier com.truth.training.server \
                   --scripts packaging/macos \
                   truth-core-server-macos.pkg
      - name: Verify binary
        run: ./payload/usr/local/bin/truth-core-server --version || true
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: truth-core-server-macos
          path: truth-core-server-macos.pkg
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: false
          path: artifacts
      - name: Publish Release (attach artifacts only)
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/truth-core-server-linux/**/*
            artifacts/truth-core-server-windows/**/*
            artifacts/truth-core-server-macos/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

