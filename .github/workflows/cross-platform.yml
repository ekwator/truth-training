name: Cross-Platform Build

on:
  # push:
  #   branches: [ master ]
  #   tags:
  #     - '**'
  # pull_request:
  #   branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (ARM64 + x86_64)
    runs-on: ubuntu-latest
    outputs:
      artifact-name: libtruth_core-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;26.1.10909125
      - name: Export NDK toolchain
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - name: Build Android libs
        run: |
          cargo build --release --target aarch64-linux-android --features mobile --lib -p truth_core
          cargo build --release --target x86_64-linux-android --features mobile --lib -p truth_core
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtruth_core-android
          path: |
            target/aarch64-linux-android/release/libtruth_core.so
            target/x86_64-linux-android/release/libtruth_core.so
          if-no-files-found: error

  ios:
    name: iOS (ARM64 + Simulator)
    runs-on: macos-latest
    outputs:
      artifact-name: libtruth_core-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
      - name: Build iOS static libraries
        run: |
          cargo build --release --target aarch64-apple-ios --features mobile --lib -p truth_core
          cargo build --release --target aarch64-apple-ios-sim --features mobile --lib -p truth_core
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtruth_core-ios
          path: |
            target/aarch64-apple-ios/release/libtruth_core.a
            target/aarch64-apple-ios-sim/release/libtruth_core.a
          if-no-files-found: error

  desktop:
    name: Desktop (Linux/Windows/macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop lib (truth_core)
        run: cargo build --release --features desktop --lib -p truth_core
      - name: Test desktop (all tests with desktop feature)
        run: |
          # Run all tests with desktop feature enabled
          # This includes:
          # - Unit tests in src/ that require desktop features
          # - Integration tests in tests/ that use truth_core::p2p (requires desktop)
          # - Tests that use actix_web (requires desktop)
          # - Tests in tests/integration/ that access p2p modules
          echo "🧪 Running all tests with --features desktop..."
          cargo test --features desktop --lib --tests
          echo "✅ Desktop feature tests completed"
      - name: Upload Desktop artifacts (libtruth_core-desktop)
        uses: actions/upload-artifact@v4
        with:
          name: libtruth_core-desktop-${{ matrix.os }}
          path: |
            # Rust rlib (Windows often without lib prefix)
            target/**/release/deps/*truth_core-*.rlib
            # Static/Shared libs across OSes
            target/**/release/*truth_core.a
            target/**/release/*truth_core.so
            target/**/release/*truth_core.dylib
            target/**/release/*truth_core.dll
            target/**/release/*truth_core.lib
            target/**/release/*truth_core.dll.lib
          if-no-files-found: warn

  publish-release:
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: false
          path: artifacts
      - name: Check artifacts structure
        run: |
          echo "Artifacts directory structure:"
          find artifacts -type f 2>/dev/null | head -30 || echo "No files found"
          echo "---"
          ls -la artifacts/ || echo "artifacts/ directory not found"
          echo "---"
          if [ -d "artifacts/libtruth_core-android" ]; then
            echo "Android artifacts found:"
            ls -la artifacts/libtruth_core-android/
          fi
          if [ -d "artifacts/libtruth_core-ios" ]; then
            echo "iOS artifacts found:"
            ls -la artifacts/libtruth_core-ios/
          fi
      - name: Prepare release files
        run: |
          # Create a temp directory for files to upload
          mkdir -p release-assets
          
          # Function to copy files with deduplication
          copy_unique_dir() {
            local src_dir="$1"
            local dest_dir="$2"
            
            if [ ! -d "$src_dir" ]; then
              return 0
            fi
            
            # Find all files in directory recursively
            while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                local filename=$(basename "$file")
                local dest="$dest_dir/$filename"
                # Only copy if destination doesn't exist
                if [ ! -f "$dest" ]; then
                  cp "$file" "$dest" 2>/dev/null || true
                  echo "  ✓ Copied: $filename"
                else
                  echo "  ⊘ Skipped duplicate: $filename"
                fi
              fi
            done < <(find "$src_dir" -type f -print0 2>/dev/null || true)
          }
          
          echo "📦 Preparing release files..."
          
          # Copy all library files, avoiding duplicates
          if [ -d "artifacts/libtruth_core-android" ]; then
            echo "Processing libtruth_core-android..."
            copy_unique_dir "artifacts/libtruth_core-android" "release-assets"
          fi
          if [ -d "artifacts/libtruth_core-ios" ]; then
            echo "Processing libtruth_core-ios..."
            copy_unique_dir "artifacts/libtruth_core-ios" "release-assets"
          fi
          if [ -d "artifacts/libtruth_core-desktop-ubuntu-latest" ]; then
            echo "Processing libtruth_core-desktop-ubuntu-latest..."
            copy_unique_dir "artifacts/libtruth_core-desktop-ubuntu-latest" "release-assets"
          fi
          if [ -d "artifacts/libtruth_core-desktop-windows-latest" ]; then
            echo "Processing libtruth_core-desktop-windows-latest..."
            copy_unique_dir "artifacts/libtruth_core-desktop-windows-latest" "release-assets"
          fi
          if [ -d "artifacts/libtruth_core-desktop-macos-latest" ]; then
            echo "Processing libtruth_core-desktop-macos-latest..."
            copy_unique_dir "artifacts/libtruth_core-desktop-macos-latest" "release-assets"
          fi
          
          echo ""
          echo "📋 Files prepared for upload:"
          find release-assets -type f -exec ls -lh {} \; | awk '{print "  " $9 " (" $5 ")"}'
          echo ""
          echo "Total files: $(find release-assets -type f | wc -l)"
      - name: Check release exists
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if ! gh release view "$TAG_NAME" &>/dev/null; then
            echo "❌ Release '$TAG_NAME' does not exist!"
            echo "   Please create the release first using create-release.sh script"
            exit 1
          fi
          echo "✓ Release '$TAG_NAME' exists"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish Release (attach artifacts only)
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

