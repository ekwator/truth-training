name: Cross-Platform Build

on:
  push:
    branches: [ master ]
    tags:
      - '**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (ARM64 + x86_64)
    runs-on: ubuntu-latest
    outputs:
      artifact-name: libtruth_core-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;26.1.10909125
      - name: Export NDK toolchain
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - name: Build Android libs
        run: |
          cargo build --release --target aarch64-linux-android --features mobile --lib -p truth_core
          cargo build --release --target x86_64-linux-android --features mobile --lib -p truth_core
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtruth_core-android
          path: |
            target/aarch64-linux-android/release/libtruth_core.so
            target/x86_64-linux-android/release/libtruth_core.so
          if-no-files-found: error

  ios:
    name: iOS (ARM64 + Simulator)
    runs-on: macos-latest
    outputs:
      artifact-name: libtruth_core-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
      - name: Build iOS static libraries
        run: |
          cargo build --release --target aarch64-apple-ios --features mobile --lib -p truth_core
          cargo build --release --target aarch64-apple-ios-sim --features mobile --lib -p truth_core
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtruth_core-ios
          path: |
            target/aarch64-apple-ios/release/libtruth_core.a
            target/aarch64-apple-ios-sim/release/libtruth_core.a
          if-no-files-found: error

  desktop:
    name: Desktop (Linux/Windows/macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop lib (truth_core)
        run: cargo build --release --features desktop --lib -p truth_core
      - name: Test desktop
        run: cargo test --features desktop
      - name: Upload Desktop artifacts (libtruth_core-desktop)
        uses: actions/upload-artifact@v4
        with:
          name: libtruth_core-desktop-${{ matrix.os }}
          path: |
            # Rust rlib (Windows often without lib prefix)
            target/**/release/deps/*truth_core-*.rlib
            # Static/Shared libs across OSes
            target/**/release/*truth_core.a
            target/**/release/*truth_core.so
            target/**/release/*truth_core.dylib
            target/**/release/*truth_core.dll
            target/**/release/*truth_core.lib
            target/**/release/*truth_core.dll.lib
          if-no-files-found: warn

  publish-release:
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: false
          path: artifacts
      - name: Check artifacts structure
        run: |
          echo "Artifacts directory structure:"
          find artifacts -type f 2>/dev/null | head -30 || echo "No files found"
          echo "---"
          ls -la artifacts/ || echo "artifacts/ directory not found"
          echo "---"
          if [ -d "artifacts/libtruth_core-android" ]; then
            echo "Android artifacts found:"
            ls -la artifacts/libtruth_core-android/
          fi
          if [ -d "artifacts/libtruth_core-ios" ]; then
            echo "iOS artifacts found:"
            ls -la artifacts/libtruth_core-ios/
          fi
      - name: Prepare release files
        run: |
          # Create a temp directory for files to upload
          mkdir -p release-assets
          # Copy all library files, preserving structure
          if [ -d "artifacts/libtruth_core-android" ]; then
            cp -r artifacts/libtruth_core-android/* release-assets/ 2>/dev/null || true
          fi
          if [ -d "artifacts/libtruth_core-ios" ]; then
            cp -r artifacts/libtruth_core-ios/* release-assets/ 2>/dev/null || true
          fi
          if [ -d "artifacts/libtruth_core-desktop-ubuntu-latest" ]; then
            cp -r artifacts/libtruth_core-desktop-ubuntu-latest/* release-assets/ 2>/dev/null || true
          fi
          if [ -d "artifacts/libtruth_core-desktop-windows-latest" ]; then
            cp -r artifacts/libtruth_core-desktop-windows-latest/* release-assets/ 2>/dev/null || true
          fi
          if [ -d "artifacts/libtruth_core-desktop-macos-latest" ]; then
            cp -r artifacts/libtruth_core-desktop-macos-latest/* release-assets/ 2>/dev/null || true
          fi
          echo "Files prepared for upload:"
          find release-assets -type f | head -20
      - name: Publish Release (attach artifacts only)
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: false
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

