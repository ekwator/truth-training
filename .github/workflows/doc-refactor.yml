name: doc-refactor

on:
#  push:
#    branches: [ main ]
#    tags:
#      - '**'
#  pull_request:
#    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doc-refactor:
    name: Documentation Refactor (inventory, links, restructure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install doc-refactor dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate && pip install -r requirements.txt
      - name: Run doc-refactor pipeline
        run: |
          . .venv/bin/activate
          make doc-refactor-run
          make doc-refactor-test

# End of file
