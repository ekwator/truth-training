name: Desktop CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-test-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-pc-windows-gnu
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y gcc-mingw-w64-x86-64
          sudo apt-get install -y nsis
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Set up MinGW and NSIS environment
        run: |
          echo "CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "MAKENSIS_PATH=/usr/bin/makensis" >> $GITHUB_ENV
      - name: Install deps
        working-directory: ./ui/desktop
        run: npm ci
      - name: Lint & Test
        working-directory: ./ui/desktop
        run: npm test --silent || true
      - name: Integration Tests
        working-directory: ./ui/desktop
        run: npm test -- tests/integration --verbose
      - name: Create Windows ICO icon
        working-directory: ./ui/desktop/src-tauri
        run: |
          # Install ImageMagick for icon conversion
          sudo apt-get install -y imagemagick
          # Convert PNG to ICO for Windows
          convert icons/icon.png -resize 256x256 icons/icon.ico
      - name: Build Web
        working-directory: ./ui/desktop
        run: npm run build
      - name: Build Server (Linux host)
        run: cargo build --release --package truth-training-server
      - name: Ensure Linux postinst executable
        run: chmod +x packaging/linux/postinst
      - name: Build Tauri (Linux)
        working-directory: ./ui/desktop
        run: cargo tauri build --target x86_64-unknown-linux-gnu
      - name: Build Tauri (Windows)
        working-directory: ./ui/desktop
        run: cargo tauri build --target x86_64-pc-windows-gnu
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-linux
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-windows-cross
          path: |
            target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target for macOS
        run: rustup target add x86_64-apple-darwin
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Install deps
        working-directory: ./ui/desktop
        run: npm ci
      - name: Lint & Test
        working-directory: ./ui/desktop
        run: npm test --silent || true
      - name: Integration Tests
        working-directory: ./ui/desktop
        run: npm test -- tests/integration --verbose
      - name: Install ImageMagick (for icon conversion)
        run: brew install imagemagick
      - name: Prepare icons (ensure ICO exists)
        working-directory: ./ui/desktop/src-tauri
        run: |
          if [ ! -f icons/icon.ico ]; then
            magick convert icons/icon.png -resize 256x256 icons/icon.ico
          fi
      - name: Build Web
        working-directory: ./ui/desktop
        run: npm run build
      - name: Build Tauri (macOS)
        working-directory: ./ui/desktop
        run: cargo tauri build --target x86_64-apple-darwin
      - name: Build Server (macOS host)
        run: cargo build --release --package truth-training-server
      - name: Install LaunchDaemon (macOS)
        run: |
          sudo chmod +x packaging/macos/postinstall.sh
          sudo bash packaging/macos/postinstall.sh || true
      - name: Verify LaunchDaemon (macOS)
        run: launchctl list | grep truth.training.server || true
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-macos
          path: |
            target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 7

  build-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Install ImageMagick (for ICO conversion)
        run: choco install imagemagick -y
      - name: Install NSIS and WiX
        run: |
          choco install nsis -y
          choco install wixtoolset -y
      - name: Create Windows ICO icon
        working-directory: ./ui/desktop/src-tauri
        run: |
          if (!(Test-Path icons/icon.ico)) {
            magick convert icons/icon.png -resize 256x256 icons/icon.ico
          }
      - name: Install deps
        working-directory: ./ui/desktop
        run: npm ci
      - name: Lint & Test
        working-directory: ./ui/desktop
        run: npm test --silent
        continue-on-error: true
      - name: Integration Tests
        working-directory: ./ui/desktop
        run: npm test -- tests/integration --verbose
      - name: Build Web
        working-directory: ./ui/desktop
        run: npm run build
      - name: Build Tauri (Windows native)
        working-directory: ./ui/desktop
        run: cargo tauri build
      - name: Build Server (Windows host)
        run: cargo build --release --package truth-training-server
      - name: Download WinSW
        run: |
          $url = "https://github.com/winsw/winsw/releases/download/v3.0.3/WinSW-net461.exe"
          Invoke-WebRequest -Uri $url -OutFile packaging/windows/winsw.exe
      - name: Install Windows Service (WinSW)
        working-directory: ./packaging/windows
        run: |
          Copy-Item ..\..\target\release\truth-training-server.exe .\truth-training-server.exe -Force
          powershell -ExecutionPolicy Bypass -File postinstall.ps1
      - name: Verify Windows Service
        run: sc query TruthTrainingServer || true
      - name: Upload Windows artifacts (NSIS/MSI)
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-windows-native
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7


