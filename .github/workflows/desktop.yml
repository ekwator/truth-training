      - name: Install NSIS and WiX
        run: |
          choco install nsis -y
          choco install wixtoolset -y
      - name: Create Windows ICO icon
        working-directory: ./ui/desktop/src-tauri
        run: |
          if (!(Test-Path icons/icon.ico)) {
