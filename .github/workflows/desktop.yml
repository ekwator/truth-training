          fi

          # Check spec/README.md
          if ! grep -q "v${MAIN_VERSION}" spec/README.md; then
            echo "❌ spec/README.md does not contain v${MAIN_VERSION}"
            exit 1
          fi

          # Check UI_Desktop.md for matching core/server version
          if ! grep -q "Core/Server v${MAIN_VERSION}" docs/UI_Desktop.md && ! grep -q "Core/Server version: v${MAIN_VERSION}" docs/UI_Desktop.md; then
            echo "❌ docs/UI_Desktop.md missing correct core/server version reference"
            exit 1
          fi

          echo "✅ All documentation files reference correct version v${MAIN_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target for macOS
        run: rustup target add x86_64-apple-darwin
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Install deps
        working-directory: ./ui/desktop
        run: npm ci
      - name: Lint & Test
        working-directory: ./ui/desktop
        run: npm test --silent || true
      - name: Integration Tests
        working-directory: ./ui/desktop
        run: npm test -- tests/integration --verbose
      - name: Install ImageMagick (for icon conversion)
        run: brew install imagemagick
      - name: Prepare icons (ensure ICO exists)
        working-directory: ./ui/desktop/src-tauri
        run: |
          if [ ! -f icons/icon.ico ]; then
            magick convert icons/icon.png -resize 256x256 icons/icon.ico
          fi
      - name: Build Web
        working-directory: ./ui/desktop
        run: npm run build
      - name: Build Tauri (macOS)
        working-directory: ./ui/desktop
        run: cargo tauri build --target x86_64-apple-darwin
      - name: Build Server (macOS host)
        run: cargo build --release --bin truth_core_server --features desktop --target x86_64-apple-darwin
      - name: Upload Server binary (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_server-macos-bin
          path: target/x86_64-apple-darwin/release/truth_core_server
          if-no-files-found: warn
          retention-days: 7
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-macos
          path: |
            target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Cargo crate versions against docs/VERSION_REGISTRY.md
        shell: bash
        run: |
          set -e
          echo "🔍 Extracting expected package versions from docs/VERSION_REGISTRY.md..."
          awk -F'|' '/\|/ && /v[0-9]+\.[0-9]+\.[0-9]+/ && !/^\| Crate/ && !/^\|--/ {
            gsub(/^[ ]+|[ ]+$/, "", $2);
            gsub(/^[ ]+|[ ]+$/, "", $3);
            pkg = $2;
            ver = $3;
            sub(/^v/, "", ver); # use sub, not gensub
            print pkg ":" ver;
          }' docs/VERSION_REGISTRY.md | sort > expected_versions.txt
          cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | "\(.name):\(.version)"' | sort > actual_versions.txt
          # Normalize CR/LF line endings to LF (portable, works on GNU/BSD sed)
          sed -i'' -e 's/\r$//' expected_versions.txt
          sed -i'' -e 's/\r$//' actual_versions.txt
          # Ensure trailing newlines
          echo >> expected_versions.txt
          echo >> actual_versions.txt
          echo "🔍 Comparing expected vs actual..."
          diff_out=$(diff -u expected_versions.txt actual_versions.txt || true)
          if [ -n "$diff_out" ]; then
            echo "❌ Version mismatch detected between docs/VERSION_REGISTRY.md and Cargo crates:"
            echo "$diff_out"
            exit 1
          fi
          echo "✅ All Cargo crate versions match docs/VERSION_REGISTRY.md"

  build-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation version alignment
        shell: bash
        run: |
          echo "🔍 Checking documentation files for correct version strings..."
          MAIN_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')

          # Check VERSION_REGISTRY.md
          if ! grep -q "v${MAIN_VERSION}" docs/VERSION_REGISTRY.md; then
            echo "❌ VERSION_REGISTRY.md does not contain v${MAIN_VERSION}"
            exit 1
          fi

          # Check spec/README.md
          if ! grep -q "v${MAIN_VERSION}" spec/README.md; then
            echo "❌ spec/README.md does not contain v${MAIN_VERSION}"
            exit 1
          fi

          # Check UI_Desktop.md for matching core/server version
          if ! grep -q "Core/Server v${MAIN_VERSION}" docs/UI_Desktop.md && ! grep -q "Core/Server version: v${MAIN_VERSION}" docs/UI_Desktop.md; then
            echo "❌ docs/UI_Desktop.md missing correct core/server version reference"
            exit 1
          fi

          echo "✅ All documentation files reference correct version v${MAIN_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Install ImageMagick (for ICO conversion)
        run: choco install imagemagick -y
      - name: Install NSIS and WiX
        run: |
          choco install nsis -y
          choco install wixtoolset -y
      - name: Create Windows ICO icon
        working-directory: ./ui/desktop/src-tauri
        run: |
          if (!(Test-Path icons/icon.ico)) {
            magick convert icons/icon.png -resize 256x256 icons/icon.ico
          }
      - name: Install deps
        working-directory: ./ui/desktop
        run: npm ci
      - name: Lint & Test
        working-directory: ./ui/desktop
        run: npm test --silent
        continue-on-error: true
      - name: Integration Tests
        working-directory: ./ui/desktop
        run: npm test -- tests/integration --verbose
      - name: Build Web
        working-directory: ./ui/desktop
        run: npm run build
      - name: Build Tauri (Windows native)
        working-directory: ./ui/desktop
        run: cargo tauri build
      - name: Build Server (Windows host)
        run: cargo build --release --bin truth_core_server --features desktop
      - name: Upload Server binary (Windows native)
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_server-windows-bin
          path: target/release/truth_core_server.exe
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Windows artifacts (NSIS/MSI)
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-windows-native
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Cargo crate versions against docs/VERSION_REGISTRY.md
        shell: bash
        run: |
          set -e
          echo "🔍 Extracting expected package versions from docs/VERSION_REGISTRY.md..."
          awk -F'|' '/\|/ && /v[0-9]+\.[0-9]+\.[0-9]+/ && !/^\| Crate/ && !/^\|--/ {
            gsub(/^[ ]+|[ ]+$/, "", $2);
            gsub(/^[ ]+|[ ]+$/, "", $3);
            pkg = $2;
            ver = $3;
            sub(/^v/, "", ver); # use sub, not gensub
            print pkg ":" ver;
          }' docs/VERSION_REGISTRY.md | sort > expected_versions.txt
          cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | "\(.name):\(.version)"' | sort > actual_versions.txt
          # Normalize CR/LF line endings to LF (portable, works on GNU/BSD sed)
          sed -i'' -e 's/\r$//' expected_versions.txt
          sed -i'' -e 's/\r$//' actual_versions.txt
          # Ensure trailing newlines
          echo >> expected_versions.txt
          echo >> actual_versions.txt
          echo "🔍 Comparing expected vs actual..."
          diff_out=$(diff -u expected_versions.txt actual_versions.txt || true)
          if [ -n "$diff_out" ]; then
            echo "❌ Version mismatch detected between docs/VERSION_REGISTRY.md and Cargo crates:"
            echo "$diff_out"
            exit 1
          fi
          echo "✅ All Cargo crate versions match docs/VERSION_REGISTRY.md"

  publish-release:
    needs: [build-test-linux-windows, build-test-macos, build-windows-native]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: false
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          name: Desktop UI Release (${{ github.ref_name }})
          body: |
            ## Desktop UI Release ${{ github.ref_name }}

            This release includes all desktop application binaries and installers for Linux, macOS, and Windows.

            ### Included Artifacts

            #### Server Binaries
            - **Linux**: `truth_core_server` (x86_64-unknown-linux-gnu)
            - **macOS**: `truth_core_server` (x86_64-apple-darwin)
            - **Windows (Cross-compiled)**: `truth_core_server.exe` (x86_64-pc-windows-gnu)
            - **Windows (Native)**: `truth_core_server.exe` (native Windows build)

            #### Linux Distributables
            - **Debian Package**: `.deb` installer for Debian/Ubuntu-based systems
            - **AppImage**: Portable application bundle (`.AppImage`)

            #### macOS Distributables
            - **DMG**: Disk image installer (`.dmg`)
            - **Application Bundle**: `.app` bundle

            #### Windows Distributables
            - **NSIS Installer (Cross-compiled)**: `.exe` installer built on Linux with MinGW
            - **NSIS Installer (Native)**: `.exe` installer built natively on Windows
            - **MSI Installer**: `.msi` installer for Windows

            ### Installation Instructions

            **Linux:**
            - Install the `.deb` package using your package manager, or
            - Make the `.AppImage` executable and run it directly

            **macOS:**
            - Open the `.dmg` file and drag the application to your Applications folder

            **Windows:**
            - Run the `.exe` installer or use the `.msi` installer for enterprise deployment

          files: |
            artifacts/truth_core_server-linux-bin/*
            artifacts/truth_core_server-macos-bin/*
            artifacts/truth_core_server-windows-bin-cross/*
            artifacts/truth_core_server-windows-bin/*
            artifacts/truth_training-linux/**/*
            artifacts/truth_training-macos/**/*
            artifacts/truth_training-windows-cross/**/*
            artifacts/truth_training-windows-native/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
