name: Desktop CI

on:
  push:
    branches: [ master ]
    tags:
      - '**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation version alignment
        shell: bash
        run: |
          echo "🔍 Checking documentation files for correct version strings..."
          MAIN_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')

          # Check VERSION_REGISTRY.md
          if ! grep -q "v${MAIN_VERSION}" docs/VERSION_REGISTRY.md; then
            echo "❌ VERSION_REGISTRY.md does not contain v${MAIN_VERSION}"
            exit 1
          fi

          # Check spec/README.md
          if ! grep -q "v${MAIN_VERSION}" spec/README.md; then
            echo "❌ spec/README.md does not contain v${MAIN_VERSION}"
            exit 1
          fi

          # Check UI_Desktop.md for matching core/server version
          if ! grep -q "Core/Server v${MAIN_VERSION}" docs/UI_Desktop.md && ! grep -q "Core/Server version: v${MAIN_VERSION}" docs/UI_Desktop.md; then
            echo "❌ docs/UI_Desktop.md missing correct core/server version reference"
            exit 1
          fi

          echo "✅ All documentation files reference correct version v${MAIN_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-pc-windows-gnu
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64 mingw-w64-tools
          sudo apt-get install -y nsis
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Set up MinGW and NSIS environment
        run: |
          echo "CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "MAKENSIS_PATH=/usr/bin/makensis" >> $GITHUB_ENV
      - name: Install deps
        working-directory: ./ui/desktop
        run: npm ci
      - name: Lint & Test
        working-directory: ./ui/desktop
        run: npm test --silent || true
      - name: Integration Tests
        working-directory: ./ui/desktop
        run: npm test -- tests/integration --verbose
      - name: Create Windows ICO icon
        working-directory: ./ui/desktop/src-tauri
        run: |
          # Install ImageMagick for icon conversion
          sudo apt-get install -y imagemagick
          # Convert PNG to ICO for Windows
          convert icons/icon.png -resize 256x256 icons/icon.ico
      - name: Build Web
        working-directory: ./ui/desktop
        run: npm run build
      - name: Build Server (Linux host)
        run: cargo build --release --bin truth_core_server --features desktop --target x86_64-unknown-linux-gnu
      - name: Build Tauri (Linux)
        working-directory: ./ui/desktop
        run: cargo tauri build --target x86_64-unknown-linux-gnu
      - name: Build Tauri (Windows)
        working-directory: ./ui/desktop
        run: cargo tauri build --target x86_64-pc-windows-gnu
      - name: Build Server (Windows cross)
        run: cargo build --release --bin truth_core_server --features desktop --target x86_64-pc-windows-gnu
      - name: Upload Server binary (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_server-linux-bin
          path: target/x86_64-unknown-linux-gnu/release/truth_core_server
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Server binary (Windows cross)
        uses: actions/upload-artifact@v4
        with:
          name: truth_core_server-windows-bin-cross
          path: target/x86_64-pc-windows-gnu/release/truth_core_server.exe
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-linux
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truth_training-windows-cross
          path: |
            target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Cargo crate versions against docs/VERSION_REGISTRY.md
        shell: bash
        run: |
          set -e
          echo "🔍 Extracting expected package versions from docs/VERSION_REGISTRY.md..."
          awk -F'|' '/\|/ && /v[0-9]+\.[0-9]+\.[0-9]+/ && !/^\| Crate/ && !/^\|--/ {
            gsub(/^[ ]+|[ ]+$/, "", $2);
            gsub(/^[ ]+|[ ]+$/, "", $3);
            pkg = $2;
            ver = $3;
            sub(/^v/, "", ver); # use sub, not gensub
            print pkg ":" ver;
          }' docs/VERSION_REGISTRY.md | sort > expected_versions.txt
          cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | "\(.name):\(.version)"' | sort > actual_versions.txt
          # Normalize CR/LF line endings to LF (portable, works on GNU/BSD sed)
          sed -i'' -e 's/\r$//' expected_versions.txt
          sed -i'' -e 's/\r$//' actual_versions.txt
          # Ensure trailing newlines
          echo >> expected_versions.txt
          echo >> actual_versions.txt
          echo "🔍 Comparing expected vs actual..."
          diff_out=$(diff -u expected_versions.txt actual_versions.txt || true)
          if [ -n "$diff_out" ]; then
            echo "❌ Version mismatch detected between docs/VERSION_REGISTRY.md and Cargo crates:"
            echo "$diff_out"
            exit 1
          fi
          echo "✅ All Cargo crate versions match docs/VERSION_REGISTRY.md"

  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation version alignment
        shell: bash
        run: |
          echo "🔍 Checking documentation files for correct version strings..."
          MAIN_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')

          # Check VERSION_REGISTRY.md
          if ! grep -q "v${MAIN_VERSION}" docs/VERSION_REGISTRY.md; then
            echo "❌ VERSION_REGISTRY.md does not contain v${MAIN_VERSION}"
